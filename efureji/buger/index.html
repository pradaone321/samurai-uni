<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ハンバーガー</title>
</head>

<body>
	<style>
@charset "UTF-8";
@media screen and (max-width:600px){

	#btn{
		position: fixed;
		top: 0;
		right: 5px;
		width: 44px;
		height: 44px;
		z-index: 10;
		display: flex;
		flex-direction: column;
		justify-content: space-evenly;
		align-items: center;
		cursor: pointer ;
	}
	#btn span{
		display: flex;
		background-color: #333;
		width: 36px;
		height: 2px;
		transition: all 0.5s ease;
	};
.navList li,.navList_secound li{
	display: flex;
	flex-direction: column;
	align-items: center;
	padding: 20px 0;
	transition: all 0.5s ease;
	list-style-type: none;
}
.navList li a{
 margin: 15px auto;
}

nav{
	position: fixed;
	width: 100%;
	top: -1000px;
}

nav.on {
    top: 0;
  }


#btn.on span {
    /* background-color: #fff; */
  }
  #btn.on span:nth-of-type(1) {
    transform: translateY(11px) rotate(45deg);
  }
  #btn.on span:nth-of-type(2) {
    transform: scale(0);
  }
  #btn.on span:nth-of-type(3) {
    transform: translateY(-12px) rotate(-45deg);
  }

}



	</style>
	<div id="btn">
		  <span class="hamburger__line hamburger__line--1"></span>
		  <span class="hamburger__line hamburger__line--2"></span>
		  <span class="hamburger__line hamburger__line--3"></span>
	</div>
		<nav id="menu" class="sp-nav">
			<!---主なナビゲーション-->
            <ul class="navList">
              <li class="menu">
              <a target="_blank" href="https://www.f-regi.com/">
                <span>画像</span><br>
                <span>決済サービス</span>
              </a>
              </li>
              <li class="menu">
              <a target="_blank" href="https://www.f-regi.com/service/ftax.html">
                <span>画像</span><br>
                <span>決済手段</span>
              </a>
              </li>
              <li>
              <a target="_blank" href="https://www.f-regi.com/kifu/">
                <span>画像</span><br>
                <span>接続方式</span>
              </a>
              </li>
              <li>
              <a target="_blank" href="https://www.f-regi.com/pay/">
                <span>画像</span><br>
                <span>決済ツール</span>
              </a>
              </li>
              <li>
                <a target="_blank" href="https://www.f-regi.com/pay/">
                  <span>画像</span><br>
                  <span>リアル決済</span>
                </a>
              </li>
              <li>
                <a target="_blank" href="https://www.f-regi.com/pay/">
                  <span>画像</span><br>
                  <span>目的から探す</span>
                </a>
              </li>
            </ul>
			<!---サブナビゲーション-->
			<ul class="navList_secound">
				<li><a href="https://www.f-regi.com/scene/casestudies.html">導入事例</a></li>
				<li><a href="https://www.f-regi.com/introduction/fee.html">料金案内</a></li>
				<li><a href="https://www.f-regi.com/introduction/">申込案内</a></li>
				<li><a href="https://www.f-regi.com/faq/">よくあるご質問</a></li>			
			</ul>
		</nav>
		<div class="black-bg" id="js-black-bg"></div>
	</div>



<script>
const btn = document.getElementById("btn");
const menu = document.getElementById("menu");
const links = document.querySelectorAll("#menu a");

btn.addEventListener("click", () => {
  btn.classList.toggle("on");
  menu.classList.toggle("on");
});

links.forEach((link) => {
  link.addEventListener("click", () => {
    btn.classList.toggle("on");
    menu.classList.toggle("on");
  });
});
</script>
</body>

</html>
