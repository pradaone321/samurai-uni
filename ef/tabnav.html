<script>

//GethashID関数クリックした値
function GethashID (hashIDName){
	if(hashIDName){
		$('.tabArea li').find('a').each(function() { // タブのaタグ全て取得
			var idName = $(this).attr('href'); // aタグのリンク名 tab内#の値を取得 全ての＃まるまるを取得するために、すべてのaタグを取得

			if(idName == hashIDName){
				var parentElm = $(this).parent(); //aタグのリンク名 tab内#の値を取得 その親要素(li)を取得
				$('.tabArea li').removeClass("active"); //li にactiveがあれば削除
				$(parentElm).addClass("active"); //li activeがなければ追加
				$(".area").removeClass("is-active"); //選択項目と同じ方になければ削除
				$(hashIDName).addClass("is-active"); //あれば追加
			}

		});
	}
}

$('.tabArea a').on('click', function() { //クリックイベント
	var idName = $(this).attr('href');
	GethashID (idName); //GethashID関数
	return false;
});

//初期設定　最初に表示しておきたい内容
$(' ul .tabArea li:first-of-type').addClass("active"); 
$('#left').addClass("is-active");
